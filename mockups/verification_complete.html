</div>
</div>
</div>
<!-- Interaction Logic for Live Countdown and Rapid Override -->
<script>
    (() => {
      const TOTAL_MS = 2500;
      const INTERVAL_MS = 50;
      let remaining = TOTAL_MS;
      
      const bar = document.getElementById('countdownBar');
      const text = document.getElementById('countdownText');
      const skipBtn = document.getElementById('skipBtn');

      function completeTransition() {
        if (bar) bar.style.width = '0%';
        if (text) text.textContent = '0.0s';
        if (skipBtn) skipBtn.classList.add('opacity-75');
        setTimeout(() => {
          window.location.href = 'qr_scan.html';
        }, 150);
      }

      const timer = setInterval(() => {
        remaining -= INTERVAL_MS;
        if (remaining <= 0) {
          clearInterval(timer);
          completeTransition();
        } else {
          if (bar) bar.style.width = ((remaining / TOTAL_MS) * 100) + '%';
          if (text) text.textContent = (remaining / 1000).toFixed(1) + 's';
        }
      }, INTERVAL_MS);

      if (skipBtn) {
        skipBtn.addEventListener('click', () => {
          clearInterval(timer);
          window.location.href = 'qr_scan.html';
        });
      }
    })();
  </script>
