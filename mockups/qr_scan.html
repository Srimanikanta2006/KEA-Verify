<div class="absolute bottom-0 inset-x-0 bg-surface-container-highest/90 text-on-surface font-label-sm text-[10px] text-center py-0.5 uppercase tracking-tight">

<div class="flex flex-col min-w-0 flex-1">
<div class="flex items-center justify-between gap-1 mb-1">

<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm flex-shrink-0">

<!-- Micro-interaction script -->
<script>
    function toggleTorch(btn) {
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon.innerText === 'flash_on') {
        icon.innerText = 'flash_off';
        btn.classList.add('bg-primary-container', 'text-white');
        btn.classList.remove('bg-surface-container', 'text-on-surface');
      } else {
        icon.innerText = 'flash_on';
        btn.classList.remove('bg-primary-container', 'text-white');
        btn.classList.add('bg-surface-container', 'text-on-surface');
      }
    }

    function triggerLiveCapture(btn) {
      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Processing AI Face Vector...</span>`;
      btn.classList.add('opacity-90');
      setTimeout(() => {
        btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check</span><span>Matched &amp; Verified (99.4%)</span>`;
        btn.classList.remove('bg-primary-container', 'opacity-90');
        btn.classList.add('bg-tertiary', 'text-on-tertiary');
        setTimeout(() => {
          window.location.href = 'verification_complete.html';
        }, 700);
      }, 1000);
    }
  </script>
